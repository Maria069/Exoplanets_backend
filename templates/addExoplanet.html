<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Exoplanets</title>
        <link rel="stylesheet" href="/static/styles/addExoplanet_style.css">
    </head>
    <body>
        <div class="space">
        <div class="container">
            {{ if .hasDraft }}
            <form action="/PublishExoplanet" method="POST">
                <div class="media-row">
                    <div class="media-item">
                        <label for="file-upload" class="lb_src">Фото:</label>
                        <img src="http://localhost:9000/exoplanets-assets/{{ .exoplanet.ImagePath }}" class="src" width="100px" height="100px" />
                        <!-- <img src="/static/img/base_photo.png" width="50px" height="50px" /> -->
                    </div>
                    <div class="media-item">
                        <label for="file-upload" class="lb_src">Видео:</label>
                        <video src="http://localhost:9000/exoplanets-assets/{{ .exoplanet.VideoPath }}" class="video-preview" width="100px" height="100px"></video>
                    </div>
                </div>

                <form>
                <label for="title">Планета:</label>
                <input class="txt" type="text" id="title" name="title"
                    value="{{ .exoplanet.Title }}"
                    placeholder="Введите название">

                <label for="distance">Расстояние до звезды (а. е.):</label>
                <input class="txt" type="text" id="distance" name="distance"
                    value="{{ .exoplanet.Distance }}"
                    placeholder="например, 1"
                    inputmode="decimal">

                <label for="temperature">Масса звезды (масс Солнца):</label>
                <input class="txt" type="text" id="weight" name="weight"
                    value="{{ .exoplanet.Weight }}"
                    placeholder="например, 25.5"
                    inputmode="decimal">

                <label for="description">Описание:</label>
                <textarea class="description" id="description" name="description"
                        placeholder="Описание планеты">{{ .exoplanet.Description }}</textarea>

                <button type="submit" class="add-btn">Добавить</button>
                </form>
            </form>
            {{ else }}
            <form class="add-form" action="/AddExoplanet" method="POST">
                
                    <label for="file-upload">Фото:</label>
                    <input class="file" type="file" id="file-upload" name="uploadedFile">
                
                    <label for="file-upload">Видео:</label>
                    <input class="file" type="file" id="file-upload" name="uploadedFile">
                
                    <label for="title">Планета:</label>
                    <input class="txt" type="text" id="title" name="title"
                        value="{{ .exoplanet.Title }}"
                        placeholder="Введите название">
                    
                        <button type="submit" class="add-btn">Далее</button>
                
            </form>
            {{ end }}
            
        </div>

        <div class="nav">
            <ul class="nav-list">
            <li>
                <a href="/Exoplanets/1">
                <img class="pic" src="/static/img/main.png" alt="Лента" width="50px" height="50px" />
                </a>
            </li>
            <li class="active">
                <a href="/AddExoplanet">
                <img class="pic" src="/static/img/plus.png" alt="Добавление" width="50px" height="50px"/>
                </a>
            </li>
            <li>
                <a href="/Exoplanets">
                <img class="pic" src="/static/img/cards.png" alt="Плитка"width="50px" height="50px"/>
                </a>
            </li>
            </ul>
        </div>
        </div>
    </body>
</html>
