<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Exoplanets</title>
        <link rel="stylesheet" href="/static/styles/addExoplanet_style.css">
    </head>
    <body>
        <div class="space">
        <div class="container">
            <form>
                <label for="file-upload">Фото:</label>
                <input class="file" type="file" id="file-upload" name="uploadedFile">
            </form>
            <form>
                <label for="file-upload">Видео:</label>
                <input class="file" type="file" id="file-upload" name="uploadedFile">
            </form>
            <form>
                <label for="name">Планета:</label>
                <input class="txt" type="text" id="title" placeholder="{{ .exoplanet.Title }}">
            </form>
            <form>
                <label for="name">Расстояние до звезды (а. е.):</label>
                <input class="txt" type="text" id="title" placeholder="{{ .exoplanet.Distance }}">
            </form>
            <form>
                <label for="name">Температура звезды (°C):</label>
                <input class="txt" type="text" id="title" placeholder="{{ .exoplanet.Temperature }}">
            </form>
            <form>
                <label for="name">Описание:</label>
                <input class="description" type="text" id="title" placeholder="{{ .exoplanet.Description }}">
            </form>
            
        </div>

        <div class="nav">
            <ul class="nav-list">
            <li>
                <a href="/Exoplanets/1">
                <img class="pic" src="/static/img/main.png" alt="Лента" width="50px" height="50px" />
                </a>
            </li>
            <li class="active">
                <a href="/AddExoplanet">
                <img class="pic" src="/static/img/plus.png" alt="Добавление" width="50px" height="50px"/>
                </a>
            </li>
            <li>
                <a href="/Exoplanets">
                <img class="pic" src="/static/img/cards.png" alt="Плитка"width="50px" height="50px"/>
                </a>
            </li>
            </ul>
        </div>
        </div>
    </body>
</html>
